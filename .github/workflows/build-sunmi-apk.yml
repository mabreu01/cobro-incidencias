name: Build SUNMI Cobro APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'sunmi-app/**'
      - 'index.html'
      - '.github/workflows/build-sunmi-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '7.6.4'
      - name: Build debug APK
        run: gradle -p sunmi-app assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Cobro-por-Incidencias-SUNMI-APK
          path: sunmi-app/build/outputs/apk/debug/sunmi-app-debug.apk
          if-no-files-found: error
          retention-days: 30
